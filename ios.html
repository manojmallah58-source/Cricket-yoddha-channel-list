<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad-Free Stream Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .player-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Aapka link yahan iframe ke andar load hoga -->
        <iframe 
            id="streamFrame"
            src="https://allrounder-live12.pages.dev/hotstar" 
            allowfullscreen="true" 
            allow="encrypted-media; autoplay; picture-in-picture">
        </iframe>
    </div>

    <script>
        // 1. Naye tabs ya popups khulne se rokne ke liye window.open ko override karna
        window.open = function() {
            console.warn("Popup/Redirect blocked!");
            return null;
        };

        // 2. Click-jacking aur unwanted redirects ko rokne ke liye safety check
        document.addEventListener('click', function(event) {
            // Agar koi external link ya redirect trigger hota hai toh use rok sakte hain
            const target = event.target.closest('a');
            if (target && target.getAttribute('target') === '_blank') {
                event.preventDefault();
            }
        }, true);

        // 3. Agar iframe ke andar koi dynamic ad overlay ya banner inject hota hai
        setInterval(() => {
            try {
                const iframe = document.getElementById('streamFrame');
                // Cross-origin policy ki wajah se agar iframe ki DOM access na ho paye toh yeh error catch kar lega
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                
                // Iframe ke andar ke common ad elements ko remove karna
                const unwantedAds = iframeDoc.querySelectorAll('iframe[src*="ad"], .adsbygoogle, div[id^="ad-"], div[class*="popup"], div[class*="overlay"]');
                unwantedAds.forEach(ad => ad.remove());
            } catch (e) {
                // Cross-Origin restriction ke karan yeh normal hai agar third-party domain ki DOM direct access na ho
            }
        }, 1000);
    </script>

</body>
</html>
