<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    :root{--c1:#6366f1;--c2:#8b5cf6;--c3:#ec4899;--c4:#f97316;--c5:#10b981;--c6:#06b6d4;--bg:#070710;--bg2:#0c0c1d;--bg3:#111127;--bg4:#15152e;--text:#e2e8f0;--muted:#475569;--border:rgba(99,102,241,.14);}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:'Inter',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;color:var(--text);}
    ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--c1),var(--c3));border-radius:4px}
    #bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.3;}

    #overlay{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px}
    .loader-wrap{position:relative;width:64px;height:64px}

    @keyframes glow-pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.3);opacity:1}}
    .dots{display:flex;gap:7px;align-items:center}
    .dots span{width:7px;height:7px;border-radius:50%;animation:dot-bounce .85s ease-in-out infinite}
    .dots span:nth-child(1){background:var(--c1)}
    .dots span:nth-child(2){background:var(--c2);animation-delay:.14s}
    .dots span:nth-child(3){background:var(--c3);animation-delay:.28s}
    @keyframes dot-bounce{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-7px);opacity:1}}
    #loadMsg{color:var(--muted);font-size:12px;font-weight:500;text-align:center}

    #status{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:9997;padding:6px 16px;font-size:11px;font-weight:600;border-radius:24px;pointer-events:none;opacity:0;transform:translateY(-8px);transition:opacity .3s,transform .3s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);max-width:260px}
    #status.show{opacity:1;transform:translateY(0)}
    #status.ok{background:rgba(16,185,129,.14);color:#34d399;border:1px solid rgba(16,185,129,.22)}
    #status.warn{background:rgba(249,115,22,.14);color:#fb923c;border:1px solid rgba(249,115,22,.22)}
    #status.err{background:rgba(239,68,68,.14);color:#f87171;border:1px solid rgba(239,68,68,.22)}

    #channel-list{position:fixed;inset:0;z-index:9998;background:var(--bg);display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:max(24px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));opacity:0;transition:opacity .4s ease}

    .ch-card .grp-badge{position:absolute;top:8px;right:8px;font-size:7px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:8px;opacity:.85}
    .ch-logo{width:100%;max-width:96px;height:auto;max-height:50px;object-fit:contain;border-radius:6px;padding:3px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
    .ch-card:hover .ch-logo{transform:scale(1.08)}
    .ch-ph{width:96px;height:50px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;letter-spacing:1px}
    .ch-name{color:var(--text);font-size:11px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:30px;width:100%}
    #no-res{display:none;color:var(--muted);text-align:center;padding:60px 20px;font-size:13px;width:100%}

    @media(max-width:480px){#ch-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}.ch-card{min-height:106px;padding:12px 8px;border-radius:13px}.ch-logo{max-height:36px;max-width:76px}.ch-ph{width:76px;height:36px;font-size:13px}.ch-name{font-size:10px}.header-text h1{font-size:17px}.g-pill{font-size:9px;padding:4px 11px}}
    @media(max-width:360px){#ch-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:7px}.ch-card{min-height:90px;padding:9px 6px;border-radius:11px}.ch-logo{max-height:30px;max-width:64px}.ch-ph{width:64px;height:30px;font-size:11px}}

    #pc{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;touch-action:manipulation}

    .sp-btn{background:transparent!important;border:none!important;cursor:pointer!important;padding:0 8px!important;opacity:.8;display:flex;align-items:center;justify-content:center;gap:5px;height:100%;min-width:36px;color:#fff!important;-webkit-tap-highlight-color:transparent}

    #retryOverlay{position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:24px;flex-direction:column;gap:16px;text-align:center}
    #retryOverlay.show{display:flex}
    #retryOverlay h3{font-size:18px;font-weight:700;color:#f87171;max-width:400px}
    #retryOverlay p{color:var(--muted);font-size:13px;max-width:400px;line-height:1.6}
    #retryBtn{padding:14px 32px;border-radius:40px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-weight:700;font-size:14px;border:none;cursor:pointer;box-shadow:0 6px 24px rgba(99,102,241,.35);font-family:inherit}

    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
<script>
(function(){
"use strict";

/* ═══════════ AMBIENT CANVAS ═══════════ */
(function(){
  var cv=document.getElementById('bg-canvas'),cx=cv.getContext('2d');
  var COLS=['#6366f1','#8b5cf6','#ec4899','#f97316','#06b6d4','#10b981','#eab308'],orbs=[];
  function resize(){cv.width=innerWidth;cv.height=innerHeight}
  resize();addEventListener('resize',resize);
  for(var i=0;i<8;i++)orbs.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:100+Math.random()*200,dx:(Math.random()-.5)*.45,dy:(Math.random()-.5)*.45,col:COLS[i%COLS.length],ph:Math.random()*Math.PI*2});
  function frame(t){
    cx.clearRect(0,0,cv.width,cv.height);
    orbs.forEach(function(o){
      o.x+=o.dx;o.y+=o.dy;
      var p=1+.1*Math.sin(t*.0008+o.ph);
      if(o.x<-o.r||o.x>cv.width+o.r)o.dx*=-1;
      if(o.y<-o.r||o.y>cv.height+o.r)o.dy*=-1;
      var g=cx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r*p);
      g.addColorStop(0,o.col+'4a');g.addColorStop(1,'transparent');
      cx.beginPath();cx.fillStyle=g;cx.arc(o.x,o.y,o.r*p,0,Math.PI*2);cx.fill();
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ═══════════════════════════════════════════════════════
   SINGLE KEY MAP — one "keyId:key" per channel
   ═══════════════════════════════════════════════════════ */
var SINGLE_KEYS = {

  "Star Sports 1 Telugu HD": "a56a509011675303900ead16165ba38f:c4c4c7aec0ff4a3fa0c6d8cb1ae56c30",
  "Star Sports 2 Hindi":     "f9af22f6d76f5f5d98a35eed7fc35292:b979fbf840b5c984733d28aaf683762e",
  "Star Sports 2 Telugu":    "e85ffc940cfc5c5790a24b714acef1cd:fda416daac7608bfd608ab4c5b724a84",
  "Star Sports 2 Tamil":     "0a0ad7fdf02955d483496e5d5ad41b64:cc1d01a4ccfd47da4f5ff62e20686505"
};

/* ═══════════ CONFIG ═══════════ */
var API_URL="https://sportlink-tv10.pages.dev/star.json";
function apiUrl(){return API_URL+"?t="+Date.now();}

var $overlay=document.getElementById("overlay"),$loadMsg=document.getElementById("loadMsg"),$status=document.getElementById("status"),$list=document.getElementById("channel-list"),$grid=document.getElementById("ch-grid"),$grpBar=document.getElementById("grp-bar"),$sInput=document.getElementById("search-input"),$sClear=document.getElementById("search-clear"),$noRes=document.getElementById("no-res"),$count=document.getElementById("channelCount"),$pc=document.getElementById("pc"),$vid=document.getElementById("v"),$retryOverlay=document.getElementById("retryOverlay"),$retryMsg=document.getElementById("retryMsg"),$retryBtn=document.getElementById("retryBtn"),$backBtn=document.getElementById("backBtn");
var _stTmr=null,allChannels=[],curGroup='All',searchQ='';

/* ═══════════ HELPERS ═══════════ */
function toast(msg,type,dur){
  $status.textContent=msg;$status.className="show "+(type||"ok");
  if(_stTmr)clearTimeout(_stTmr);
  if(dur!==0){_stTmr=setTimeout(function(){$status.className=$status.className.replace("show","").trim();_stTmr=null;},dur||4000);}
}
function setMsg(m){$loadMsg&&($loadMsg.textContent=m);}
function hideOverlay(){$overlay.style.transition="opacity .4s ease";$overlay.style.opacity="0";setTimeout(function(){$overlay.style.display="none";},420);}
function getChId(){return new URLSearchParams(location.search).get("id")||"";}
function rawCookie(c){if(!c)return"";if(c.startsWith("Cookie="))c=c.substring(7);if(c.startsWith("__hdnea__="))return c.slice(10);return c;}
function withCookie(u,r){if(!u||!r)return u;if(u.indexOf("__hdnea__")!=-1)return u;return u+(u.indexOf("?")!==-1?"&":"?")+"__hdnea__="+r;}

function normalize(list){
  return list.map(function(ch){
    var n={
      id:String(ch.id||''),
      name:ch.name||'Unnamed',
      stream_url:ch.stream_url||ch.mpd_url||'',
      cookie:ch.cookie||'',
      logo:ch.logo||'',
      group:ch.group||ch.category||'Star Sports'
    };
    var sfKey = SINGLE_KEYS[n.name];
    if(sfKey){
      var parts = sfKey.split(':');
      n.key_id = parts[0];
      n.key = parts[1];
    } else {
      n.key_id = ch.key_id||'';
      n.key = ch.key||'';
    }
    if(n.stream_url && n.stream_url.indexOf('|')!==-1){
      var p=n.stream_url.split('|');
      n.stream_url=p[0];
      p[1].split('&').forEach(function(kv){
        var ei=kv.indexOf('=');if(ei===-1)return;
        var k=kv.substring(0,ei).trim(),v=kv.substring(ei+1).trim();
        if(k==='User-Agent')n.user_agent=v;
        else if(k==='Referer')n.referer=v;
        else if(k==='Origin')n.origin=v;
        else if(k==='Cookie'&&!n.cookie)n.cookie=v;
      });
    }
    return n;
  });
}

async function loadData(){
  var r=await fetch(apiUrl(),{cache:"no-store",headers:{Accept:"application/json"}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  var d=await r.json();
  var raw=Array.isArray(d)?d:(d.channels?Object.values(d.channels):[]);
  if(!raw.length) throw new Error("Empty response");
  return {channels:normalize(raw)};
}

var GRP_STYLE={
  'Star Sports':{bg:'rgba(99,102,241,.14)',txt:'#818cf8',strip:'#6366f1,#8b5cf6'},
  'Sony Sports':{bg:'rgba(249,115,22,.14)',txt:'#fb923c',strip:'#f97316,#eab308'},
  'Others':{bg:'rgba(16,185,129,.14)',txt:'#34d399',strip:'#10b981,#06b6d4'}
};
function gStyle(g){return GRP_STYLE[g]||{bg:'rgba(99,102,241,.10)',txt:'#818cf8',strip:'#6366f1,#8b5cf6'};}

var io=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.05});

function getTier(){var mem=navigator.deviceMemory||4,cor=navigator.hardwareConcurrency||4;var mob=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);var conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;var net=conn?(conn.effectiveType||"4g"):"4g";if(!mob)return"high";if(mem<=1.5||cor<=2||net==="slow-2g"||net==="2g")return"low";if(mem<=3||cor<=4)return"mid";return"high";}
var PROF={low:{buf:5,reBuf:1.5,behind:15,maxH:480,maxBw:1200000,bwEst:400000},mid:{buf:8,reBuf:1.5,behind:25,maxH:720,maxBw:3500000,bwEst:1000000},high:{buf:12,reBuf:1.5,behind:30,maxH:1080,maxBw:0,bwEst:2000000}}[getTier()];

var FITS=["contain","fill","cover"],MODE_LABEL={contain:"Fit",fill:"Fill",cover:"Zoom"};
var FICO={contain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="2" y1="21" x2="22" y2="21"/></svg>',fill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>',cover:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M6 7l3 3m0 0H7m2 0V8m9-1l-3 3m0 0h2m-2 0V8M6 13l3-3m0 0H7m2 0v2m9 1l-3-3m0 0h2m-2 0v2"/></svg>'};
var PIP_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="12" width="7" height="5" rx="1" fill="currentColor" stroke="none"/></svg>';

function renderGroups(channels){
  var groups=['All'],seen={};
  channels.forEach(function(ch){if(ch.group)seen[ch.group]=true;});
  Object.keys(seen).sort().forEach(function(g){groups.push(g);});
  var f=document.createDocumentFragment();
  groups.forEach(function(g){
    var p=document.createElement('span');
    p.className='g-pill'+(g===curGroup?' on':'');
    p.textContent=g;p.dataset.g=g;
    p.addEventListener('click',function(){curGroup=g;document.querySelectorAll('.g-pill').forEach(function(x){x.classList.toggle('on',x.dataset.g===g);});applyFilters();});
    f.appendChild(p);
  });
  $grpBar.innerHTML='';$grpBar.appendChild(f);
}

function applyFilters(){
  var list=allChannels;
  if(curGroup!=='All')list=list.filter(function(c){return c.group===curGroup;});
  if(searchQ.trim()){var q=searchQ.trim().toLowerCase();list=list.filter(function(c){return c.name.toLowerCase().includes(q);});}
  renderCards(list);
}

function renderCards(list){
  $count.textContent=list.length+' channels';
  if(!list.length){$grid.style.display='none';$noRes.style.display='block';return;}
  $grid.style.display='grid';$noRes.style.display='none';
  var f=document.createDocumentFragment();
  list.forEach(function(ch,i){
    var a=document.createElement('a');
    a.className='ch-card';a.href='?id='+encodeURIComponent(ch.id);
    a.style.transitionDelay=(Math.min(i,24)*.028)+'s';
    var gs=gStyle(ch.group);
    var acc=document.createElement('div');acc.className='acc';acc.style.background='linear-gradient(90deg,'+gs.strip+')';a.appendChild(acc);
    if(ch.group&&ch.group!=='General'){
      var gb=document.createElement('span');gb.className='grp-badge';gb.textContent=ch.group;
      gb.style.background=gs.bg;gb.style.color=gs.txt;gb.style.border='1px solid '+gs.txt+'33';a.appendChild(gb);
    }
    if(ch.logo&&ch.logo.trim()){
      var img=document.createElement('img');img.className='ch-logo';img.src=ch.logo;img.alt=ch.name;img.loading='lazy';
      img.onerror=function(){this.style.display='none';};a.appendChild(img);
    } else {
      var initials=ch.name.split(' ').slice(0,2).map(function(w){return w[0]||'';}).join('');
      var ph=document.createElement('div');ph.className='ch-ph';ph.style.background=gs.bg;ph.style.border='1px solid '+gs.txt+'33';ph.style.color=gs.txt;ph.textContent=initials;a.appendChild(ph);
    }
    var nm=document.createElement('span');nm.className='ch-name';nm.textContent=ch.name;a.appendChild(nm);
    f.appendChild(a);io.observe(a);
  });
  $grid.innerHTML='';$grid.appendChild(f);
}

function renderList(data){
  allChannels=data.channels||data;
  renderGroups(allChannels);applyFilters();
  $list.style.display='flex';
  requestAnimationFrame(function(){requestAnimationFrame(function(){$list.classList.add('ready');});});
  hideOverlay();
}

$sInput.addEventListener('input',function(){searchQ=$sInput.value;$sClear.classList.toggle('on',searchQ.length>0);applyFilters();});
$sClear.addEventListener('click',function(){$sInput.value='';searchQ='';$sClear.classList.remove('on');applyFilters();$sInput.focus();});
$sInput.addEventListener('keydown',function(e){if(e.key==='Escape')$sClear.click();});

function errMsg(msg){setMsg(msg);$overlay.style.display='flex';toast(msg,'err',0);}
function shakaErrStr(e){if(!e)return"Unknown";var c={1:"Network",2:"Text",3:"Media",4:"Manifest",5:"Streaming",6:"DRM",7:"Player"};var s=(c[e.category]||"Err")+" "+e.category+":"+e.code;if(e.data&&e.data[0]&&typeof e.data[0]==="string")s+=" — "+e.data[0].slice(0,72);return s;}

function ratioLabel(w,h){
  if(!w||!h)return"";
  function gcd(a,b){return b?gcd(b,a%b):a;}
  var g=gcd(w,h)||1,rw=w/g,rh=h/g;
  var common={"16:9":16/9,"4:3":4/3,"21:9":21/9,"1:1":1,"9:16":9/16,"3:2":3/2};
  var real=w/h,best=null,bd=.02;
  Object.keys(common).forEach(function(k){var d=Math.abs(common[k]-real);if(d<bd){bd=d;best=k;}});
  if(best)return best;if(rw<=40&&rh<=40)return rw+":"+rh;return real.toFixed(2)+":1";
}

function injectControls(container,vid){
  var panel=container.querySelector(".shaka-controls-button-panel");if(!panel)return;
  var anchor=panel.querySelector(".shaka-fullscreen-button");
  var fitIdx=0;
  var fitBtn=document.createElement("button");
  fitBtn.className="sp-btn sp-fit-btn";fitBtn.title="Fit";
  fitBtn.innerHTML='<span class="fit-icon">'+FICO.contain+'</span><span class="fit-ratio">--</span>';
  if(anchor)panel.insertBefore(fitBtn,anchor);else panel.appendChild(fitBtn);
  function applyFit(i){fitIdx=i;var m=FITS[i];vid.classList.remove("mode-fill","mode-cover");if(m==="fill")vid.classList.add("mode-fill");if(m==="cover")vid.classList.add("mode-cover");var ic=fitBtn.querySelector(".fit-icon");if(ic)ic.innerHTML=FICO[m];fitBtn.title="Fit: "+MODE_LABEL[m];}
  fitBtn.addEventListener("click",function(e){e.stopPropagation();applyFit((fitIdx+1)%FITS.length);});
  function updateRatio(){var l=ratioLabel(vid.videoWidth,vid.videoHeight);var b=fitBtn.querySelector(".fit-ratio");if(b&&l)b.textContent=l;}
  vid.addEventListener("loadedmetadata",updateRatio);vid.addEventListener("resize",updateRatio);updateRatio();
  var pipOk=!!(document.pictureInPictureEnabled||(vid.webkitSupportsPresentationMode&&typeof vid.webkitSetPresentationMode==="function"));
  if(pipOk){
    var pipBtn=document.createElement("button");
    pipBtn.className="sp-btn sp-pip-btn";pipBtn.title="PiP";pipBtn.innerHTML=PIP_ICON;
    panel.insertBefore(pipBtn,fitBtn);
    pipBtn.addEventListener("click",async function(e){
      e.stopPropagation();
      try{
        if(document.pictureInPictureEnabled){
          if(document.pictureInPictureElement)await document.exitPictureInPicture();else await vid.requestPictureInPicture();
        }else if(vid.webkitSupportsPresentationMode){
          vid.webkitSetPresentationMode(vid.webkitPresentationMode==="picture-in-picture"?"inline":"picture-in-picture");
        }
      }catch(_){toast("PiP unavailable","warn",2500);}
    });
  }
}

async function startPlayer(ch){
  $pc.style.display="flex";
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){errMsg("Browser not supported.");return;}
  var player=new shaka.Player();
  await player.attach($vid);
  new shaka.ui.Overlay(player,$pc,$vid).configure({
    controlPanelElements:["play_pause","mute","volume","time_and_duration","spacer","quality","fullscreen"],
    seekBarColors:{base:"#334155",buffered:"rgba(99,102,241,.35)",played:"#6366f1"}
  });
  setTimeout(function(){injectControls($pc,$vid);},100);

  var state={
    cookie:'', raw:'', url:'',
    key_id:'', key:'',
    restrictionsRelaxed:false
  };

  function applyChannelData(c){
    state.cookie=c.cookie||'';
    if(state.cookie&&!state.cookie.startsWith('__hdnea__=')) state.cookie='__hdnea__='+state.cookie;
    state.raw=rawCookie(state.cookie);
    state.url=c.stream_url||'';
    var sfKey = SINGLE_KEYS[c.name];
    if(sfKey){
      var parts = sfKey.split(':');
      state.key_id = parts[0];
      state.key = parts[1];
    } else {
      state.key_id = c.key_id||'';
      state.key = c.key||'';
    }
  }
  applyChannelData(ch);

  function buildCfg(){
    var restr={};
    if(!state.restrictionsRelaxed){
      if(PROF.maxH<1080)restr.maxHeight=PROF.maxH;
      if(PROF.maxBw>0)restr.maxBandwidth=PROF.maxBw;
    }
    var cfg={
      manifest:{defaultPresentationDelay:4,ignoreTextStreamFailures:true,retryParameters:{maxAttempts:3,baseDelay:400,backoffFactor:2,fuzzFactor:.5,timeout:20000}},
      streaming:{lowLatencyMode:false,bufferingGoal:PROF.buf,rebufferingGoal:PROF.reBuf,bufferBehind:PROF.behind,safeSeekOffset:4,stallEnabled:true,stallThreshold:1,stallSkip:.3,inaccurateManifestTolerance:0,retryParameters:{maxAttempts:3,baseDelay:400,backoffFactor:2,fuzzFactor:.5,timeout:20000}},
      abr:{enabled:true,defaultBandwidthEstimate:PROF.bwEst,switchInterval:4,restrictions:restr}
    };
    if(state.key_id&&state.key) cfg.drm={clearKeys:{[state.key_id]:state.key}};
    return cfg;
  }
  player.configure(buildCfg());

  var T=shaka.net.NetworkingEngine.RequestType;
  player.getNetworkingEngine().registerRequestFilter(function(type,req){
    req.headers["Referer"]=ch.referer||"https://www.jiotv.com/";
    req.headers["User-Agent"]=ch.user_agent||"Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
    req.headers["Origin"]=ch.origin||"https://www.jiotv.com";
    if(state.cookie) req.headers["Cookie"]=state.cookie;
    if(type===T.MANIFEST||type===T.SEGMENT)
      req.uris=req.uris.map(function(u){return withCookie(u,state.raw);});
  });

  var refreshing=false,retries=0,edgeTried=false,started=false;

  function unmuteOnce(){$vid.muted=false;}
  $pc.addEventListener("pointerdown",unmuteOnce,{capture:true,once:true});

  function showRetry(msg){
    $retryMsg.textContent=msg||"The stream may be temporarily offline or the cookie has expired.";
    $retryOverlay.classList.add('show');
  }
  $retryOverlay.addEventListener('click',function(e){if(e.target===$retryOverlay)$retryOverlay.classList.remove('show');});
  $retryBtn.addEventListener('click',function(){
    $retryOverlay.classList.remove('show');
    retries=0;
    loadFresh();
  });
  $backBtn.addEventListener('click',function(){location.href=location.pathname;});

  async function loadFresh(){
    if(refreshing)return;
    refreshing=true;
    toast("Fetching fresh cookie…","warn",0);
    try{
      var d=await loadData();
      var chs=d.channels||d;
      var fresh=chs.find(function(c){return String(c.id)===String(ch.id);});
      if(fresh) applyChannelData(fresh);
      player.configure(buildCfg());
      await player.load(state.url);
      $vid.play().catch(function(){});
      retries=0;edgeTried=false;
      toast("● Live","ok",4000);
    }catch(err){
      console.warn("loadFresh failed:",err);
      retries++;
      if(retries>=6){showRetry("API could not be reached. Check your connection and retry.");}
      else setTimeout(function(){refreshing=false;loadFresh();},1200);
    }finally{
      refreshing=false;
    }
  }

  var RECOVERABLE=[1001,1002,1003,4012,6006,6007,7000,7001,7002,6008,6011,6012,3007];

  player.addEventListener("error",function(ev){
    var err=ev.detail,code=err&&err.code,category=err&&err.category;
    if(code===4014&&!state.restrictionsRelaxed){
      state.restrictionsRelaxed=true;
      player.configure(buildCfg());
      toast("Relaxing quality…","warn",2000);
      player.load(state.url).then(function(){$vid.play().catch(function(){});}).catch(function(){loadFresh();});
      return;
    }
    if(RECOVERABLE.indexOf(code)!==-1||category===6){
      if(retries<6){retries++;loadFresh();}
      else showRetry(shakaErrStr(err));
      return;
    }
    toast(shakaErrStr(err),"err",6000);
  });

  try{
    setMsg("Loading stream…");
    toast("Loading "+ch.name+"…","warn",0);
    await player.load(state.url);
    hideOverlay();
    toast("Tap ▶ to start","ok",5000);
  }catch(err){
    hideOverlay();
    loadFresh();
  }

  var stallTmr=null;
  function onStall(){
    if(stallTmr||refreshing)return;
    toast("Buffering…","warn",0);
    stallTmr=setTimeout(function(){
      stallTmr=null;
      if(!edgeTried&&player.isLive()){
        try{player.goToLive();edgeTried=true;toast("Syncing…","warn",2000);}
        catch(_){loadFresh();}
      } else loadFresh();
    },6000);
  }
  function onPlaying(){
    started=true;
    if(stallTmr){clearTimeout(stallTmr);stallTmr=null;}
    edgeTried=false;retries=0;
    if(!refreshing)toast("● Live","ok",3000);
  }
  $vid.addEventListener("waiting",onStall);
  $vid.addEventListener("stalled",onStall);
  $vid.addEventListener("playing",onPlaying);
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden)setTimeout(function(){if(started&&$vid.paused&&!refreshing)$vid.play().catch(function(){});},400);
  });
}

async function main(){
  var id=getChId(),data;
  try{setMsg("Fetching channels…");data=await loadData();}
  catch(err){errMsg("Could not load channels. Check connection.");console.error(err);return;}
  if(!id){renderList(data);return;}
  var chs=data.channels||data;
  var ch=chs.find(function(c){return String(c.id)===String(id);});
  if(!ch){errMsg("Channel not found.");return;}
  document.title=ch.name;
  await startPlayer(ch);
}
document.addEventListener("DOMContentLoaded",main);
})();
</script>
