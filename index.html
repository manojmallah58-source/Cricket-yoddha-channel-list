<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CRICKCAST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;
font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:root{
--cc-accent:#10b981;
--cc-bg:#070b09;
--cc-panel:#0e1512;
--cc-border:#1b2621;
--cc-text:#e8efeb;
--cc-muted:#7f8f86;
}

#overlay{position:fixed;inset:0;z-index:9999;
display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;
background:#070b09}
#overlay #loadMsg{color:var(--cc-muted);font-size:13px;font-weight:500;text-align:center}

#channel-list{position:fixed;inset:0;z-index:9998;display:none;flex-direction:column;
overflow-y:auto;-webkit-overflow-scrolling:touch;
padding:15px;background:var(--cc-bg)}

.list-header{padding:10px 0 15px}
.brand-name{font-size:20px;font-weight:700;color:#fff;letter-spacing:1px}
.brand-name span{color:var(--cc-accent)}

.cc-toolbar{display:flex;gap:10px;margin-bottom:15px}
.cc-search{position:relative;flex:1}
#cc-search-input{width:100%;padding:10px 14px;border-radius:10px;
background:var(--cc-panel);border:1px solid var(--cc-border);color:var(--cc-text);
font-family:inherit;font-size:13px;outline:none}

#ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}

.ch-card{background:var(--cc-panel);border:1px solid var(--cc-border);border-radius:12px;
overflow:hidden;cursor:pointer;text-decoration:none;display:flex;flex-direction:column}
.ch-poster{position:relative;width:100%;aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center}
.ch-poster img{width:100%;height:100%;object-fit:cover}
.ch-info{padding:10px}
.ch-info span.name{color:var(--cc-text);font-size:13px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

#pc{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain;background:#000}
video.mode-fill{object-fit:fill}
video.mode-cover{object-fit:cover}

.shaka-controls-container .shaka-overflow-menu-button,
.shaka-controls-container .shaka-capture-button,
.shaka-controls-container .shaka-cast-button,
.shaka-controls-container .shaka-pip-button {
  display: none !important;
}

#status{position:fixed;top:10px;right:10px;z-index:9997;padding:6px 12px;border-radius:8px;
background:rgba(0,0,0,0.8);color:#fff;font-size:11px;opacity:0;transition:opacity .3s}
#status.show{opacity:1}
#status.err{color:#f87171}
</style>
</head>
<body>
<div id="overlay">
<p id="loadMsg">Loading...</p>
</div>
<div id="status"></div>
<div id="channel-list">
<div class="list-header">
<div class="brand-name">CRICK<span>CAST</span></div>
</div>
<div class="cc-toolbar">
<div class="cc-search">
<input id="cc-search-input" type="text" placeholder="Search channels..." autocomplete="off">
</div>
</div>
<div id="ch-grid"></div>
</div>
<div id="pc">
<video id="v" playsinline webkit-playsinline preload="none" x5-video-player-type="h5" x5-video-player-fullscreen="true"></video>
</div>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
<script>
(function(){
"use strict";
var API = "https://raw.githubusercontent.com/sportlive18/playlist/refs/heads/main/jtv2.json";
var $overlay = document.getElementById("overlay");
var $loadMsg = document.getElementById("loadMsg");
var $status = document.getElementById("status");
var $list = document.getElementById("channel-list");
var $grid = document.getElementById("ch-grid");
var $pc = document.getElementById("pc");
var $vid = document.getElementById("v");

function toast(msg,type){
$status.textContent=msg;
$status.className="show "+(type||"");
setTimeout(function(){ $status.className=""; },3000);
}
function setMsg(m){ $loadMsg && ($loadMsg.textContent=m); }
function hideOverlay(){ $overlay && ($overlay.style.display="none"); }
function getChId(){ return new URLSearchParams(location.search).get("id")||""; }
function rawCookie(c){ return c&&c.indexOf("__hdnea__")==0?c.slice(10):(c||""); }

async function loadData(){
var r=await fetch(API+"?_t="+Date.now(),{cache:"no-store"});
if(!r.ok) throw new Error("HTTP "+r.status);
var d=await r.json();
function normalize(c){
if(!c || !c.stream_url) return null;
return {
id: String(c.id ?? ""),
name: c.name || "Live Channel",
stream_url: c.stream_url,
poster: c.poster || c.logo || "",
type: c.type || (String(c.stream_url).toLowerCase().includes(".mpd") ? "dash" : "hls"),
key_id: c.key_id || "",
key: c.key || "",
cookie: c.cookie || ""
};
}
if(d && Array.isArray(d.channels)) return {channels: d.channels.map(normalize).filter(Boolean)};
if(d && d.id != null && d.stream_url) return {channels: [normalize(d)]};
if(Array.isArray(d)) return {channels: d.map(normalize).filter(Boolean)};
throw new Error("Invalid API");
}

var ALL=[];
function renderGrid(list){
$grid.innerHTML="";
list.forEach(function(ch){
var a=document.createElement("a");
a.className="ch-card";
a.href="?id="+encodeURIComponent(ch.id);
var poster='<div class="ch-poster">'+(ch.poster?'<img src="'+ch.poster+'" loading="lazy">':'')+'</div>';
var info='<div class="ch-info"><span class="name">'+ch.name+'</span></div>';
a.innerHTML=poster+info;
$grid.appendChild(a);
});
}

function renderList(channels){
hideOverlay();
ALL=channels;
renderGrid(ALL);
var inp=document.getElementById("cc-search-input");
inp.addEventListener("input",function(){
var q=inp.value.toLowerCase();
var filtered=ALL.filter(function(c){ return (c.name||"").toLowerCase().indexOf(q)!==-1; });
renderGrid(filtered);
});
$list.style.display="flex";
}

function detectType(ch){
if(ch.type==="dash") return "application/dash+xml";
if(ch.type==="hls") return "application/x-mpegurl";
return ch.stream_url.toLowerCase().indexOf(".mpd")!==-1 ? "application/dash+xml" : "application/x-mpegurl";
}

async function startPlayer(ch){
$pc.style.display="flex";
shaka.polyfill.installAll();
if(!shaka.Player.isBrowserSupported()){ toast("Not supported","err"); return; }
var player=new shaka.Player();
await player.attach($vid);
new shaka.ui.Overlay(player,$pc,$vid).configure({
controlPanelElements:["play_pause","mute","volume","time_and_duration","spacer","quality","fullscreen"]
});

var url=ch.stream_url;
var cookie=ch.cookie||"", rawToken=rawCookie(cookie);
player.getNetworkingEngine().registerRequestFilter(function(type,req){
req.headers["Referer"]="https://www.jiotv.com/";
req.headers["User-Agent"]="Mozilla/5.0 (Linux; Android 11)";
if(cookie) req.headers["Cookie"]=cookie;
if(rawToken && (type===1||type===2)){
if(req.uris[0].indexOf("__hdnea__")===-1) req.uris[0]+=(req.uris[0].indexOf("?")===-1?"?":"&")+"__hdnea__="+rawToken;
}
});

var cfg={
streaming:{bufferingGoal:10,rebufferingGoal:2,stallEnabled:true},
abr:{enabled:true}
};
if(ch.key_id && ch.key){
cfg.drm={ clearKeys:{ } };
cfg.drm.clearKeys[ch.key_id]=ch.key;
}
player.configure(cfg);

try{
setMsg("Loading...");
await player.load(url, undefined, detectType(ch));
hideOverlay();
$vid.play().catch(function(){});
}catch(e){
hideOverlay();
toast("Error loading stream","err");
}
}

async function main(){
var id=getChId();
try{
var data=await loadData();
if(!id){ renderList(data.channels); return; }
var ch=data.channels.find(function(c){ return c.id===id; });
if(!ch){ toast("Channel not found","err"); return; }
document.title=ch.name;
await startPlayer(ch);
}catch(e){
hideOverlay();
toast("Connection error","err");
}
}
document.addEventListener("DOMContentLoaded",main);
})();
</script>
</body>
</html>
